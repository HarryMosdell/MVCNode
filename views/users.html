
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activity</title>

    <style>
        /* Main container */

        .user-view {
            max-width: 1000px;
            width: 100%;
            margin: 20px auto;
            background: #101720;
            border: 1px solid #263442;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Header */

        .user-header {
            padding: 32px;
            background:
                radial-gradient(ellipse at top right, rgba(30, 161, 154, 0.09), transparent 55%),
                #141d27;
            border-bottom: 1px solid #263442;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 28px;
        }

        .header-title span {
            display: block;
            color: #1ea19a;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .header-title h2 {
            font-size: 26px;
            font-weight: 650;
            letter-spacing: -0.8px;
            color: #f0f3f6;
            margin-bottom: 9px;
        }

        .header-title p {
            color: #8998a8;
            font-size: 13px;
            line-height: 1.6;
        }

        /* User count */

        .user-count {
            background: rgba(30, 161, 154, 0.08);
            border: 1px solid rgba(30, 161, 154, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: center;
            min-width: 105px;
        }

        .user-count span {
            display: block;
            color: #8fa3b2;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .user-count strong {
            color: #42c5bc;
            font-size: 21px;
        }

        /* Search */

        .search-container {
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 15px 18px 15px 46px;
            background: #0b121a;
            border: 1px solid #30404e;
            border-radius: 9px;
            outline: none;
            color: #f0f3f6;
            font-size: 13px;
            transition: 0.25s ease;
        }

        .search-container input:focus {
            border-color: #1ea19a;
            box-shadow: 0 0 0 3px rgba(30, 161, 154, 0.12);
        }

        .search-container input::placeholder {
            color: #718091;
        }

        .search-container::before {
            content: "⌕";
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: #8293a2;
            font-size: 23px;
            pointer-events: none;
        }

        /* User list heading */

        .list-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 19px 30px;
            background: #131c26;
            border-bottom: 1px solid #263442;
        }

        .list-heading span {
            color: #91a0ae;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* User rows */

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 22px 30px;
            border-bottom: 1px solid #202c38;
            transition: background 0.2s ease;
        }

        .user-row:last-child {
            border-bottom: none;
        }

        .user-row:hover {
            background: #17232e;
        }

        /* User details */

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-details h3 {
            color: #edf2f7;
            font-size: 14px;
            font-weight: 600;
        }

        .user-details span {
            color: #8493a1;
            font-size: 12px;
        }

        /* User status */

        .user-status {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            padding: 8px 13px;
            border-radius: 7px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        /* Online */

        .user-status.online {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.07);
            border: 1px solid rgba(74, 222, 128, 0.16);
        }

        .user-status.online .status-dot {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.7);
        }

        /* Offline */

        .user-status.offline {
            color: #f87171;
            background: rgba(248, 113, 113, 0.06);
            border: 1px solid rgba(248, 113, 113, 0.14);
        }

        .user-status.offline .status-dot {
            background: #f87171;
        }

        /* Empty message */

        .empty-message {
            padding: 40px 20px;
            text-align: center;
            color: #8493a1;
            font-size: 13px;
        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .user-view {
                margin: 10px auto;
                border-radius: 12px;
            }

            .user-header {
                padding: 23px 18px;
            }

            .header-title h2 {
                font-size: 22px;
            }

            .header-top {
                gap: 12px;
            }

            .user-count {
                min-width: 80px;
                padding: 10px;
            }

            .user-row {
                padding: 19px 18px;
                gap: 10px;
            }

            .list-heading {
                padding: 16px 18px;
            }

            .user-status {
                padding: 7px 9px;
                font-size: 10px;
            }
        }

        @media (max-width: 380px) {
            .header-top {
                flex-direction: column;
            }

            .user-count {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .user-count span {
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <div class="user-view">

        <div class="user-header">

            <div class="header-top">

                <div class="header-title">
                    <span>ADMIN PANEL</span>
                    <h2>User Activity</h2>
                    <p>Monitor user accounts and their current online status.</p>
                </div>

                <div class="user-count">
                    <span>Total Users</span>
                    <strong>—</strong>
                </div>

            </div>

            <div class="search-container">
                <input
                    type="text"
                    id="searchUser"
                    placeholder="Search for a username..."
                    autocomplete="off"
                >
            </div>

        </div>

        <div class="list-heading">
            <span>Registered Users</span>
            <span>Account Status</span>
        </div>

        <div id="userList"></div>

    </div>

    <script>

        fetch("http://localhost:3083/usersData")
            .then(res => {
                if (!res.ok) {
                    throw new Error("Failed to retrieve users");
                }

                return res.json();
            })
            .then(users => {

                const userList = document.querySelector("#userList");

                if (users.length === 0) {
                    userList.innerHTML = `
                        <p class="empty-message">No users found.</p>
                    `;
                    return;
                }

                users.forEach(user => {

                    const isOnline = user.is_loggedin === true;

                    const htmlString = `
                        <div class="user-row">

                            <div class="user-details">
                                <h3>${user.username}</h3>

                                <span>
                                    Last sign-in: ${user.last_signin ?? "Never"}
                                </span>
                            </div>

                            <div class="user-status ${isOnline ? "online" : "offline"}">
                                <span class="status-dot"></span>
                                ${isOnline ? "Online" : "Offline"}
                            </div>

                        </div>
                    `;

                    userList.insertAdjacentHTML("beforeend", htmlString);

                });

                document.querySelector(".user-count strong").textContent = users.length;

            })
            .catch(error => {

                console.error(error);

                document.querySelector("#userList").innerHTML = `
                    <p class="empty-message">Unable to load users.</p>
                `;

            });

    </script>

</body>
</html>
