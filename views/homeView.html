<script>
const button=document.querySelector("button");

button.addEventListener("click", ()=>{
    fetch("http://localhost:3083/logOut" , {
        method:"POST",
        headers: {
            "Content-Type": "application/json"
        }, 
        body: JSON.stringify({ action: "logout" })
        
    }).then(res=> res.json())
    .then(data=> alert(data.message))
}
)
</script>
