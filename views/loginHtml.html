<div class="login-page">

    <form class="login-form">
        <input type="text" class="name" placeholder="username">
        <input type="text" class="password" placeholder="password">
        <input type="submit">
    </form>

    <p class="message"></p>

</div>
<script>
  
const form= document.querySelector("form");

   const firstName= document.querySelector(".name");
   const password= document.querySelector(".password");
   const message= document.querySelector(".message");
   let deviceType;

   form.addEventListener("submit", (e)=> {
    e.preventDefault(); 

    if(window.innerWidth>=1200) deviceType="laptop/desktop";
    else if(window.innerWidth>600) deviceType="tablet";
    else deviceType="Mobile";

    fetch("/loginAsk",  {
    method:"POST", 
    headers: {
        "Content-Type": "application/json"
    }, 
    
    body: JSON.stringify({
    name: firstName.value,
    password: password.value,
    deviceType: deviceType
    }) 
    }).then(async (res) => {
        const data = await res.json();

if (res.ok) {
message.textContent = "success" + " " + data.message ;
message.style.color = "green";
window.location.href = data.redirect;

} else {
message.textContent = data.error || "failed";
message.style.color = "red";
if(data.message){
    message.textContent=data.message;
} 
}
})

})

  </script>
